<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>闭包计数器</title>
    </head>

    <body>
        <script>
            window.a = 100;
            console.log(window);
            console.log(window.a);
            console.log(a);

            b = 200;
            console.log(b);
            console.log(window);

            function fn() {
                c = 300;
            }
            fn();
            console.log(c);
            console.log(window.c);

            //变量就近原则
            var e = 10;
            var f = 20;
            function fn1() {
                e = 100;
                console.log('函数内部变量 ' + e);
                var f = 200;
                console.log('函数内部变量f ' + f);
            }
            fn1();
            console.log(e);
            console.log('全局的f ' + f);

            //函数声明+定义前置
            fn2();
            function fn2() {
                console.log("wahahaha")
            }

            //闭包计数器
            var count = 0;
            function add() {
                count++;
            }
            add();
            add();
            add();
            console.log(count);

            //闭包实现计数器
            var add2 = (
                function() {
                    //保证局部变量不会被修改并且释放
                    var count = 0;
                    return function() {
                        count++;
                        console.log(count);
                    }
                }
            )();
            // add2();
            // add2();
            alert(add2());
            alert(add2());
        </script>
    </body>
</html>
