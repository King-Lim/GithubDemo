<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>导航标签页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 导航栏容器 */
        .nav {
            display: flex;
            list-style: none;
            background: #f5f5f5;
            gap: 4px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        /* 导航项 */
        .nav li {
            padding: 8px 16px;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 6px 6px 0 0; /* 顶部圆角，做成标签效果 */
            cursor: pointer;
            user-select: none;
        }

        /* 高亮激活状态 */
        .nav li.active {
            background-color: #1677ff;
            color: #fff;
            border-color: #1677ff;
        }

        /* 内容区域 */
        .content-box {
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
        }

        /* 内容默认隐藏 */
        .content-box div {
            display: none;
            font-size: 16px;
            line-height: 1.6;
        }

        /* 显示当前内容 */
        .content-box div.show {
            display: block;
        }
    </style>
</head>

<body>
    <!-- 导航标签（用 ul li 做，更符合网页规范） -->
    <ul class="nav">
        <li class="active">首页</li>
        <li>新闻</li>
        <li>产品</li>
        <li>关于我们</li>
    </ul>

    <!-- 对应内容 -->
    <div class="content-box">
        <div class="show">这里是首页内容<br>欢迎来到本站</div>
        <div>这里是新闻内容<br>最新新闻动态</div>
        <div>这里是产品内容<br>产品展示介绍</div>
        <div>这里是关于我们<br>公司介绍联系方式</div>
    </div>

    <script>
        // 获取导航
        const navItems = document.querySelectorAll(".nav li");
        // 获取内容
        const contents = document.querySelectorAll(".content-box div");

        // 循环绑定点击
        for (let i = 0; i < navItems.length; i++) {
            // 存下标
            navItems[i].dataset.index = i;

            navItems[i].onclick = function () {
                // 1. 全部清空
                for (let j = 0; j < navItems.length; j++) {
                    navItems[j].classList.remove("active");
                    contents[j].classList.remove("show");
                }
                // 2. 当前高亮
                this.classList.add("active");
                // 3. 显示对应内容
                contents[this.dataset.index].classList.add("show");
            };
        }
    </script>
</body>
</html>
