<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Scoped CSS Variables and JS</title>
    </head>

    <body>
        <h2>Update CSS Variables with
            <span class="hl">JS</span>
        </h2>
        <div class="controls">
            <label for="spacing">Spacing:</label>
            <input type="range" id="spacing" name="spacing" min="10" max="200" value="10" data-sizing="px">

            <label for="blur">Blur:</label>
            <input type="range" id="blur" name="blur" min="0" max="25" value="10" data-sizing="px">

            <label for="base">Base Color:</label>
            <input type="color" id="base" name="base" value="#ffc600">
        </div>

        <img src="https://source.unsplash.com/7bwQXzbF6KE/800x500" alt="">

        <style>
            :root {
                --blur: 10px;
                --base: #ffc600;
                --spacing: 10px;
            }

            img {
                padding: var(--spacing);
                background: var(--base);
                filter: blur(var(--blur));
            }

            .hl {
                color: var(--base);
            }

            body {
                text-align: center;
                background: #193549;
                color: white;
                font-family: 'helvetica neue', sans-serif;
                font-size: 30px;
                font-weight: 100;
            }

            .controls {
                margin-bottom: 50px;
            }

            input {
                width: 100px;
            }
        </style>

        <script>
            const inputs = document.querySelectorAll('.controls input');
            console.log(inputs);

            function heandleUpdate() {
                const suffix = this.dataset.sizing || '';
                document.documentElement.style.setProperty(
                    `--${this.name}`, 
                    this.value + suffix
                );
            }

            inputs.forEach(input => input.addEventListener('change', heandleUpdate));
            inputs.forEach(input => input.addEventListener('mousemove', heandleUpdate));


        </script>
    </body>
</html>
