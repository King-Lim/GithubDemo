<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>HTML Video Player</title>
    <link rel="stylesheet" href="style-11.css" />
</head>

<body>
    <div class="player-wrapper">
        <!-- 左侧播放器 -->
        <div class="player">
            
            <video class="player__video viewer" src="./video/demo-11-1.mp4"></video>
            <!-- 控制面板：进度条独立层级 + 控制按钮 -->
            <div class="player__controls">
                <div class="progress">
                    <div class="progress__filled"></div>
                    <div class="progressHandle"></div>
                </div>
                <div class="control-buttons">
                    <button class="player__button toggle" title="Toggle Play">►</button>
                    <button class="player__button fullscreen" title="Toggle FullScreen">⛶</button>
                    <input type="range" name="volume" class="player__slider" min="0" max="1" step="0.05" value="0.5">
                    <input type="range" name="playbackRate" class="player__slider" min="0.5" max="2" step="0.1"
                        value="1">
                    <button data-skip="-10" class="player__button">« 10s</button>
                    <button data-skip="25" class="player__button">25s »</button>
                </div>
            </div>
        </div>

        <!-- 右侧播放列表 -->
        <div class="playlist">
            <h3>播放列表</h3>
            <ul id="videolist"></ul>
        </div>
    </div>

    <script src="script-11.js"></script>
</body>

</html>
