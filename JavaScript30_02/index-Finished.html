<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JS + CSS Clock</title>
    <link rel="icon" href="https://fav.farm/%F0%9F%A6%84">
</head>

<body>
    <div class="clock">
        <div class="clock-face">
            <div class="clock-markers"></div>
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
        </div>
    </div>

    <style>
        html {
            background: #018DED url(https://unsplash.it/1500/1000?image=881&blur=5);
            background-size: cover;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            font-size: 10px;
        }

        body {
            margin: 0;
            font-size: 2rem;
            display: flex;
            min-height: 100vh;
            align-items: center;
        }

        .clock {
            width: 30rem;
            height: 30rem;
            border: 20px solid white;
            border-radius: 50%;
            margin: 50px auto;
            position: relative;
            padding: 2rem;
            box-shadow:
                0 0 0 4px rgba(0, 0, 0, 0.1),
                inset 0 0 0 3px #efefef,
                inset 0 0 10px black,
                0 0 10px rgba(0, 0, 0, 0.2);
        }

        .clock-face {
            position: relative;
            width: 100%;
            height: 100%;
            transform: translateY(-3px);
        }

        .hand {
            width: 50%;
            height: 6px;
            background: black;
            position: absolute;
            top: 50%;
            transform-origin: 100%;
            transform: rotate(90deg);
            transition: all 0.05s;
            transition-timing-function: cubic-bezier(0.1, 1.7, 0.58, 1);
        }

        .hour-hand {
            width: 35%;
            height: 10px;
            background: #222;
            left: 15%;
        }

        /* 分针：中等长度、中等粗细、深灰色 */
        .minute-hand {
            width: 45%;
            height: 6px;
            background: #444;
            left: 5%;
        }

        /* 秒针：最长、最细、红色 */
        .second-hand {
            width: 50%;
            height: 3px;
            background: #ff3333;
        }
    </style>

    <script>

        const secondHand = document.querySelector('.second-hand');
        const minuteHand = document.querySelector('.minute-hand');
        const hourHand = document.querySelector('.hour-hand');

        function setDate() {
            const now = new Date();
            console.log('⏰ 当前时间:', now);

            const seconds = now.getSeconds();
            console.log('👉 当前秒数:', seconds);
            const secondsDegrees = ((seconds / 60) * 360) + 90;
            console.log('👉 当前秒数对应的旋转角度:', secondsDegrees);
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`;

            const mins = now.getMinutes();
            const minsDegrees = ((mins / 60) * 360) + ((seconds / 60) * 6) + 90;
            console.log('👉 当前分钟数对应的旋转角度:', minsDegrees);
            minuteHand.style.transform = `rotate(${minsDegrees}deg)`;

            const hour = now.getHours();
            const hourDegrees = ((hour / 12) * 360) + ((mins / 60) * 30) + 90;
            console.log('👉 当前小时数对应的旋转角度:', hourDegrees);
            hourHand.style.transform = `rotate(${hourDegrees}deg)`;
        }

        setInterval(setDate, 1000);

        setDate();
    </script>
</body>

</html>
