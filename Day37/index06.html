<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>ball move timer</title>
    <style>
        #box {
            width: 800px;
            height: 50px;
            border: 2px solid silver;
            position: relative;
        }

        #in {
            width: 50px;
            height: 50px;
            background: rgb(185, 152, 152);
            border-radius: 50%;
            position: absolute;
            /* transition: left 20s cubic-bezier(0, 2.77, 1, -1.14); */
            left: 0;
        }
    </style>
</head>

<body>
    <div id="box">
        <div id="in"></div>
    </div>
</body>

<script src="js/tween.js"></script>
<script>
    var ball = document.getElementById("in");
    var timer;
    var x = 0;

    var t = 0;
    var b = 0;
    var c = 750;
    var d = 100;
    ball.onclick = function () { 
        t += 10;
        this.style.left = Tween.Linear(t, b, c, d) + "px";
        console.log(Tween.Linear(t, b, c, d));
        //console.log(va);
    };
</script>

</html>
