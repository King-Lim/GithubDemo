<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>ball move timer</title>
    <style>
        #box {
            width: 800px;
            height: 50px;
            border: 2px solid silver;
            position: relative;
        }

        #in {
            width: 50px;
            height: 50px;
            background: rgb(185, 152, 152);
            border-radius: 50%;
            position: absolute;
            /* transition: left 20s cubic-bezier(0, 2.77, 1, -1.14); */
            left: 0;
        }
    </style>
</head>

<body>
    <div id="box">
        <div id="in"></div>
    </div>
</body>

<script>
    var ball = document.getElementById("in");
    var timer;
    var x = 0;

    ball.onclick = function () {
        x += 10;
        console.log(x);

        ball.style.left = x + "px";
        timer = setTimeout(ball.onclick, 1000);
        if(x >= 750) {
            clearInterval(timer);
        }
    };
</script>

</html>
