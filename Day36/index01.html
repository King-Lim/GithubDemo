<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>邮箱选择器 - 无多余布局版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 主容器：圆润卡片，无浮动，纯flex */
        #wrap {
            width: 500px;
            height: 450px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            display: flex;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        /* ========= 左侧导航区（完美填满，无多余空白） ========= */
        #left {
            width: 140px;
            background: #fafcfd;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            position: relative;
            flex-shrink: 0;
        }

        /* 导航列表也使用flex列，子项自动平分高度 */
        #left ul {
            display: flex;
            flex-direction: column;
            flex: 1;
            list-style: none;
        }

        /* 每个菜单项：自动拉伸，内部内容居中 */
        #left li {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            color: #2d3e50;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            border-left: 3px solid transparent;
            /* 不使用全局边框，改用底部细线分割（最后一个没有底部线） */
            border-bottom: 1px solid #edf2f7;
            user-select: none;
            position: relative;
        }

        /* 移除最后一个li的底部边框，避免视觉多余 */
        #left li:last-child {
            border-bottom: none;
        }

        /* 悬停效果 */
        #left li:hover {
            background: #fef7e8;
            color: #b85c00;
            border-left-color: #ffb347;
        }

        /* 激活状态：优雅高亮，无多余空白 */
        #left li.active {
            background: linear-gradient(90deg, #fff3e0 0%, #ffffff 100%);
            color: #c25b00;
            font-weight: 600;
            border-left-color: #c25b00;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        /* 箭头滑块：三角形，绝对定位在右侧中间 */
        #slider {
            width: 0;
            height: 0;
            border: 8px solid transparent;
            border-right-color: #c25b00;
            position: absolute;
            right: 0;
            top: 0;
            transition: top 0.28s cubic-bezier(0.2, 0.85, 0.4, 1);
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(-1px 0 1px rgba(0, 0, 0, 0.05));
        }

        /* ========= 右侧内容区 ========= */
        #right {
            flex: 1;
            background: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* 右侧面板容器：flex 垂直+水平居中，支持滚动 */
        #right>div {
            width: 100%;
            height: 100%;
            display: none;
            /* 默认隐藏，JS控制显示 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 28px;
            font-weight: 500;
            color: #1e2f3a;
            background: #ffffff;
            overflow-y: auto;
            padding: 24px 20px;
            gap: 14px;
            word-break: break-word;
        }

        /* 自定义滚动条（美观且不占布局空间） */
        #right>div::-webkit-scrollbar {
            width: 5px;
        }

        #right>div::-webkit-scrollbar-track {
            background: #f0f2f5;
            border-radius: 10px;
        }

        #right>div::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        /* 右侧内容装饰图标和描述 */
        .mail-icon {
            font-size: 52px;
            margin-bottom: 6px;
            display: inline-block;
        }

        .mail-desc {
            font-size: 14px;
            color: #5b6e8c;
            font-weight: 400;
            line-height: 1.5;
            max-width: 90%;
            margin-top: 6px;
        }

        /* 响应式处理：小屏幕下依然紧凑 */
        @media (max-width: 550px) {
            #wrap {
                width: 94%;
                height: 420px;
            }

            #left {
                width: 120px;
            }

            #left li {
                font-size: 13px;
            }

            .mail-icon {
                font-size: 44px;
            }

            #right>div {
                font-size: 24px;
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <div id="wrap">
        <div id="left">
            <ul>
                <li class="active" data-idx="0">📧 163邮箱</li>
                <li data-idx="1">📨 126邮箱</li>
                <li data-idx="2">🌐 yeah.net</li>
                <li data-idx="3">📱 网易手机邮箱</li>
            </ul>
            <div id="slider"></div>
        </div>

        <div id="right">
            <div>
                <span class="mail-icon">📬</span>
                <span>163 邮箱</span>
                <div class="mail-desc">专业稳定 · 超大网盘<br>亿万用户信赖之选</div>
            </div>
            <div>
                <span class="mail-icon">📮</span>
                <span>126 邮箱</span>
                <div class="mail-desc">极速体验 · 智能反垃圾<br>高效办公必备</div>
            </div>
            <div>
                <span class="mail-icon">✨</span>
                <span>yeah.net 个性邮箱</span>
                <div class="mail-desc">简洁时尚 · 彰显自我<br>轻松注册，畅邮全球</div>
            </div>
            <div>
                <span class="mail-icon">📱</span>
                <span>网易手机邮箱</span>
                <div class="mail-desc">随身邮局 · 实时推送<br>手机号快捷登录，安全省心</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // DOM 元素
            const navItems = document.querySelectorAll('#left li');
            console.log("✅ 获取到所有导航项之一:", navItems[1], " 长度：", navItems.length);

            const panels = document.querySelectorAll('#right > div');
            console.log("✅ 获取到所有面板之一:", panels[0], " 长度：", panels.length);

            const slider = document.getElementById('slider');
            console.log("✅ 获取到滑块元素:", slider);

            if (!navItems.length || !panels.length || !slider) return;

            // 获取左侧每个菜单项的实际高度（flex动态分配，需要实时计算）
            let currentActiveIndex = 0;

            // 获取滑块相对于父容器的偏移基准：每个li的平均高度（由于flex等分布局，所有li高度一致）
            function getLiHeight() {
                if (navItems.length === 0) return 0;
                // 获取第一个li的offsetHeight，因为flex等高，所有li高度相同
                return navItems[0].offsetHeight;
            }

            // 计算滑块应该在的top位置（基于当前激活索引）
            function getSliderTop(index) {
                const liHeight = getLiHeight();
                if (liHeight === 0) return 0;
                const sliderHeight = slider.offsetHeight;   // 三角形高度为16px（border上下各8）
                // 垂直居中偏移 = (li高度 - 滑块高度) / 2
                const offset = (liHeight - sliderHeight) / 2;
                return index * liHeight + offset;
            }

            // 更新滑块位置（平滑移动）
            function updateSliderPosition(index) {
                const targetTop = getSliderTop(index);
                slider.style.top = targetTop + 'px';
            }

            // 切换面板核心逻辑
            function switchToPanel(index) {
                if (index === currentActiveIndex)
                    return;
                if (index < 0 || index >= navItems.length)
                    return;

                // 更新左侧 active 类
                navItems.forEach((item, i) => {
                    if (i === index) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });

                // 更新右侧面板显示（flex 布局展示）
                panels.forEach((panel, i) => {
                    if (i === index) {
                        panel.style.display = 'flex';
                    } else {
                        panel.style.display = 'none';
                    }
                });

                // 移动滑块箭头
                updateSliderPosition(index);
                currentActiveIndex = index;
                console.log(`✅ 移动滑块到第 ${index} 个面板`);
            }

            // 初始化：确保第一个面板显示，其余隐藏，滑块定位
            function init() {
                // 确保所有面板初始隐藏，再显示激活面板
                let activeFound = false;
                for (let i = 0; i < navItems.length; i++) {
                    if (navItems[i].classList.contains('active')) {
                        currentActiveIndex = i;
                        activeFound = true;
                        break;
                    }
                }
                if (!activeFound) {
                    // 默认激活第一个
                    navItems[0].classList.add('active');
                    currentActiveIndex = 0;
                }

                // 设置右侧显示
                panels.forEach((panel, i) => {
                    panel.style.display = i === currentActiveIndex ? 'flex' : 'none';
                });

                // 延迟一帧确保布局稳定，计算滑块位置
                setTimeout(() => {
                    updateSliderPosition(currentActiveIndex);
                }, 20);
            }

            // 监听点击事件
            navItems.forEach((item, idx) => {
                item.addEventListener('click', () => {
                    if (idx === currentActiveIndex) return;
                    switchToPanel(idx);
                });
                // 增加键盘可访问性
                item.setAttribute('role', 'button');
                item.setAttribute('tabindex', '0');
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        if (idx !== currentActiveIndex) switchToPanel(idx);
                    }
                    // 上下键导航增强
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        const next = (idx + 1) % navItems.length;
                        switchToPanel(next);
                        navItems[next].focus();
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        const prev = (idx - 1 + navItems.length) % navItems.length;
                        switchToPanel(prev);
                        navItems[prev].focus();
                    }
                });
            });

            // 窗口大小改变时，重新计算滑块位置（保证无多余偏移）
            let resizeTimer;
            window.addEventListener('resize', () => {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    // 重新获取当前活跃索引，刷新滑块
                    if (currentActiveIndex !== undefined) {
                        updateSliderPosition(currentActiveIndex);
                    }
                    // 同时确保右侧面板仍然正确显示（防御）
                    panels.forEach((p, i) => {
                        if (i === currentActiveIndex && p.style.display !== 'flex') {
                            p.style.display = 'flex';
                        } else if (i !== currentActiveIndex && p.style.display === 'flex') {
                            p.style.display = 'none';
                        }
                    });
                }, 100);
            });

            // 字体缩放或内容变化导致高度变化时重新校准（比如缩放比例改变）
            const resizeObserver = new ResizeObserver(() => {
                if (currentActiveIndex !== undefined) {
                    updateSliderPosition(currentActiveIndex);
                }
            });
            if (navItems[0]) {
                resizeObserver.observe(navItems[0]);
            }
            resizeObserver.observe(document.getElementById('left'));

            // 启动
            init();
        })();
    </script>
</body>

</html>
