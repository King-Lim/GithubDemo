<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>no title</title>
        <!-- 
            javaScript: （行为） 直译是脚本语言
			组成部分： 
			1.ECMAScript: 脚本语言国际web标准，（js的核心），描述了语言的语法和基本对象，javaScript是这个规范的实现
			2.DOM: document object model 文档对象模型 
			3.BOM: borwer object model 浏览器对象模型 描述处理浏览器对象的方法
			
			特点：
			1.脚本语言（代码不用进行预编译）
			2.主要用来向html添加交互事件
			3.跨平台，浏览器都支持，可以在各个平台下运行（window,Linux,Mac,ios,Android）
        -->
    </head>

    <body>
        <div id="div1">div1</div>
        <script>
            console.log(100);
            console.log("Hello World!");
            // 打印多个值，逗号隔开
            console.log(100, "Hello World!");

            var a = 100;
            var b = 100.0;
            var str = 'Hello World!';

            console.log('a=', a);
            console.log('a='+a);

            var a=1,b=2,c=3,d=4;
            console.log('a='+b, 'b='+c);

            a = 1000;
            console.log('a='+a);

            // typeof: 获取变量类型
            var a = 100;
            console.log(typeof a);
            var b = ["1","2","3"];
            console.log(typeof b);
            var c = {"message":"hello world!"}
            console.log(typeof c);

            e = 100;
            var result = isFinite(e);
            console.log(result);
        </script>
    </body>
</html>
