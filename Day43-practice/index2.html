<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>guo da hui tai lang</title>
        <body>
            <img src="img/h0.png" alt="" id="ht1">
        </body>

        <script>
            var imgObj = document.getElementById('ht1');

            //当前图片位置
            imgObj.index = 0;

            var timer = setInterval( function() {
                imgObj.src = "img/h" + imgObj.index + ".png";
                imgObj.index++;

                if(imgObj.index > 5) {
                    clearInterval(timer);
                    var timer2 = setInterval( function() {
                        imgObj.index--;
                        imgObj.src = "img/h" + imgObj.index + ".png";
                        if(imgObj.index < 1) {
                            clearInterval(timer2);
                            document.body.remove(imgObj);
                        }
                    },200);
                }
            }, 300);

            imgObj.onclick = function() {
                clearInterval(timer);
            }
        </script>
    </head>
</html>
